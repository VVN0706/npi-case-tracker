{% extends 'base.html' %}
{% block title %}編輯使用者 - NPI 案子追蹤{% endblock %}
{% block content %}

<div class="card narrow">
  <h2>編輯使用者</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>帳號</label>
    <input type="text" name="username" value="{{ user.username }}" required>

    <label>姓名</label>
    <input type="text" name="display_name" value="{{ user.display_name }}" required>

    <label>部門</label>
    <select name="department">
      <option value="" {{ 'selected' if not user.department }}>（無部門）</option>
      {% for d in departments %}
      <option value="{{ d }}" {{ 'selected' if user.department == d }}>{{ d }}</option>
      {% endfor %}
    </select>

    <label class="checkbox-label" style="margin-top:16px">
      <input type="checkbox" name="is_admin" {{ 'checked' if user.is_admin }}> 管理員
    </label>

    <div class="form-actions">
      <button type="submit">儲存</button>
      <a href="{{ url_for('admin_users') }}" class="link-btn">取消</a>
    </div>
  </form>
</div>

{% endblock %}
